services:

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: asteroid-airflow
    container_name: asteroid-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://asteroid:asteroid@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: asteroid
      PG_USER: asteroid
      PG_PASSWORD: asteroid
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: asteroid
      RAW_DATA_DIR: /opt/airflow/data/raw
      JPL_CONTACT_EMAIL: ${JPL_CONTACT_EMAIL}
    user: "${AIRFLOW_UID:-1000}:0"
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data/raw:/opt/airflow/data/raw
      - ./airflow-logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username ${AIRFLOW_ADMIN_USER}
                 --password ${AIRFLOW_ADMIN_PASSWORD}
                 --firstname asteroid --lastname asteroid
                 --role Admin --email ${JPL_CONTACT_EMAIL} || true"

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: asteroid-airflow
    container_name: asteroid-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    user: "${AIRFLOW_UID:-1000}:0"
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: asteroid-airflow
    container_name: asteroid-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    user: "${AIRFLOW_UID:-1000}:0"
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: asteroid-postgres
    environment:
      POSTGRES_DB: asteroid
      POSTGRES_USER: asteroid
      POSTGRES_PASSWORD: asteroid
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/sql/pg_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/sql/ml_predictions.sql:/docker-entrypoint-initdb.d/02_predictions.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asteroid"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: asteroid-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: asteroid-api
    container_name: asteroid-api
    env_file: .env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: asteroid-dashboard
    container_name: asteroid-dashboard
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  mongodata: