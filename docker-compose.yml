services:

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: asteroid-airflow
    container_name: asteroid-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: "${PG_DB}"
      PG_USER: "${PG_USER}"
      PG_PASSWORD: "${PG_PASSWORD}"
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: asteroid
      RAW_DATA_DIR: /opt/airflow/data/raw
      JPL_CONTACT_EMAIL: ${JPL_CONTACT_EMAIL}
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data/raw:/opt/airflow/data/raw
      - ./airflow-logs:/opt/airflow/logs
    command: >
      bash -c '
        set -e
        airflow db migrate
        if airflow users list | grep -q "${AIRFLOW_ADMIN_USER}"; then
          echo "Airflow admin already exists."
        else
          airflow users create \
            --username "${AIRFLOW_ADMIN_USER}" \
            --password "${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Asteroid \
            --lastname Admin \
            --role Admin \
            --email "${JPL_CONTACT_EMAIL}"
        fi
        '

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: asteroid-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: asteroid-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  loader:
      build:
        context: .
        dockerfile: docker/Dockerfile.airflow
      image: asteroid-airflow
      container_name: asteroid-loader
      depends_on:
        postgres:
          condition: service_healthy
        mongo:
          condition: service_healthy
      environment: *airflow-env
      volumes: *airflow-volumes
      command:
        - bash
        - -c
        - |
          set -e
          python3 /opt/airflow/src/ingest/feed_mongo.py
          python3 /opt/airflow/src/ingest/clean_mongo.py
          python3 /opt/airflow/src/ingest/feed_postgres.py
      restart: "no"

  mongo:
    image: mongo:7.0
    container_name: asteroid-mongo
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: asteroid-postgres
    environment:
      POSTGRES_DB: "${PG_DB}"
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/sql/pg_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/sql/ml_predictions.sql:/docker-entrypoint-initdb.d/02_predictions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ml:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: asteroid-api
    container_name: asteroid-ml
    env_file:
      - .env.docker
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    command:
      - bash
      - -c
      - |
        set -e
        cd /app/src/ml
        if [ -f model.joblib ]; then
          cp model.joblib model.prev.joblib
          cp metrics.json metrics.prev.json
        fi
        python3 dataset.py
        python3 train.py
        python3 predict.py
        python3 score.py
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: asteroid-api
    container_name: asteroid-api
    env_file:
      - .env.docker
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: asteroid-dashboard
    container_name: asteroid-dashboard
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started
      loader:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:latest
    container_name: asteroid-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: asteroid-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: asteroid-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: asteroid-node-exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  promdata:
  grafanadata:
