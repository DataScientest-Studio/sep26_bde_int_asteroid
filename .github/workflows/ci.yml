name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the linter
        run: pip install ruff

      - name: Linter
         ruff check src dags --select E4,E7,E9,F

      - name: Build Docker images
        run: |
          docker build -f docker/Dockerfile.api -t asteroid-api:ci .
          docker build -f docker/Dockerfile.dashboard -t asteroid-dashboard:ci .
          docker build -f docker/Dockerfile.airflow -t asteroid-airflow:ci .