name: CD 

on:
  push:
    branches: [master, main]

jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the linter
        run: pip install ruff

      - name: Linter
        run: ruff check src dags --select E4,E7,E9,F

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: satyad18
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the images
        run: |
          docker build -f docker/Dockerfile.api -t satyad18/asteroid-api:latest .
          docker build -f docker/Dockerfile.dashboard -t satyad18/asteroid-dashboard:latest .
          docker build -f docker/Dockerfile.airflow -t satyad18/asteroid-airflow:latest .
          docker push satyad18/asteroid-api:latest
          docker push satyad18/asteroid-dashboard:latest
          docker push satyad18/asteroid-airflow:latest